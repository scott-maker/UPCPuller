<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Barcode CSV Formatter</title>
    <!-- PapaParse CDN for robust CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --border: #cbd5e1;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card);
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            border: 1px solid var(--border);
        }

        h1 {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #64748b;
            font-size: 0.95rem;
            margin-bottom: 24px;
            line-height: 1.4;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 0.9rem;
        }

        input[type="file"], input[type="number"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 0.95rem;
            background-color: #fff;
        }

        .row {
            display: flex;
            gap: 16px;
        }

        .row .form-group {
            flex: 1;
        }

        .mapping-section {
            display: none;
            background: #f1f5f9;
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border);
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #94a3b8;
            cursor: not-allowed;
        }

        .preview-container {
            margin-top: 24px;
            display: none;
        }

        .preview-container h3 {
            font-size: 0.95rem;
            margin-bottom: 8px;
        }

        pre {
            background: #0f172a;
            color: #f8fafc;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            overflow-x: auto;
            max-height: 180px;
            margin: 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Barcode CSV Formatter</h1>
    <p class="subtitle">Upload any CSV file. The app reads your header row to detect columns, reorders them (UPC first, Name second), pads leading zeros, and adds strict double quotes for printing software.</p>

    <div class="form-group">
        <label for="csvFileInput">Upload CSV File</label>
        <input type="file" id="csvFileInput" accept=".csv" onchange="loadHeaders()">
    </div>

    <!-- Mapping Options (Appears automatically when file is loaded) -->
    <div class="mapping-section" id="mappingSection">
        <div class="row">
            <div class="form-group">
                <label for="upcSelect">Base UPC Column:</label>
                <select id="upcSelect"></select>
            </div>
            <div class="form-group">
                <label for="nameSelect">Name Column:</label>
                <select id="nameSelect"></select>
            </div>
        </div>
        <div class="form-group" style="margin-bottom: 0;">
            <label for="upcLength">Target UPC Length (Digits):</label>
            <input type="number" id="upcLength" value="12" min="1" max="20">
        </div>
    </div>

    <button id="processBtn" onclick="processAndDownload()" disabled>Format & Download CSV</button>

    <div class="preview-container" id="previewContainer">
        <h3>Output Preview:</h3>
        <pre id="previewText"></pre>
    </div>
</div>

<script>
    let rawCsvData = [];

    // Step 1: Read CSV headers and auto-select matching columns
    function loadHeaders() {
        const fileInput = document.getElementById('csvFileInput');
        if (!fileInput.files.length) return;

        Papa.parse(fileInput.files[0], {
            skipEmptyLines: true,
            complete: function(results) {
                rawCsvData = results.data;
                if (!rawCsvData || rawCsvData.length < 1) {
                    alert('The uploaded CSV appears to be empty.');
                    return;
                }

                const headers = rawCsvData[0];
                const upcSelect = document.getElementById('upcSelect');
                const nameSelect = document.getElementById('nameSelect');

                // Clear previous options
                upcSelect.innerHTML = '';
                nameSelect.innerHTML = '';

                // Populate Dropdowns with header choices
                headers.forEach((header, index) => {
                    const cleanHeader = (header || `Column ${index + 1}`).trim();
                    upcSelect.options.add(new Option(cleanHeader, index));
                    nameSelect.options.add(new Option(cleanHeader, index));
                });

                // Auto-detect best match using regex
                headers.forEach((header, index) => {
                    const h = String(header).toLowerCase();
                    if (/upc|barcode|code|sku/i.test(h)) {
                        upcSelect.value = index;
                    }
                    if (/name|title|desc|item|product/i.test(h)) {
                        nameSelect.value = index;
                    }
                });

                // Show settings & enable button
                document.getElementById('mappingSection').style.display = 'block';
                document.getElementById('processBtn').disabled = false;
            },
            error: function(err) {
                alert('Error parsing CSV: ' + err.message);
            }
        });
    }

    // Step 2: Extract selected columns, pad zeros, wrap quotes, and reorder
    function processAndDownload() {
        if (!rawCsvData.length) return;

        const upcIdx = parseInt(document.getElementById('upcSelect').value, 10);
        const nameIdx = parseInt(document.getElementById('nameSelect').value, 10);
        const upcLength = parseInt(document.getElementById('upcLength').value, 10);

        let outputRows = [];

        // Dynamic Header Row ("UPC","Name")
        const origUpcHeader = (rawCsvData[0][upcIdx] || 'UPC').trim();
        const origNameHeader = (rawCsvData[0][nameIdx] || 'Name').trim();
        outputRows.push(`"${origUpcHeader}","${origNameHeader}"`);

        // Process Data Rows
        for (let i = 1; i < rawCsvData.length; i++) {
            const row = rawCsvData[i];
            
            // Extract raw values safely
            let rawName = (row[nameIdx] !== undefined ? String(row[nameIdx]) : '').trim();
            let rawUpc = (row[upcIdx] !== undefined ? String(row[upcIdx]) : '').trim();

            // Sanitize UPC (strip non-digits)
            let digitsOnly = rawUpc.replace(/[^0-9]/g, '');

            // Pad leading zeros
            let paddedUpc = digitsOnly.padStart(upcLength, '0');

            // Sanitize Name (escape existing double quotes by doubling them)
            let cleanName = rawName.replace(/"/g, '""');

            // Append standard output: "UPC","Name"
            outputRows.push(`"${paddedUpc}","${cleanName}"`);
        }

        const finalCsvContent = outputRows.join('\n');

        // Update Preview
        const previewContainer = document.getElementById('previewContainer');
        const previewText = document.getElementById('previewText');
        previewContainer.style.display = 'block';
        previewText.textContent = outputRows.slice(0, 6).join('\n') + (outputRows.length > 6 ? '\n...' : '');

        // Trigger Download
        downloadFile(finalCsvContent, 'barcode_import.csv');
    }

    function downloadFile(content, filename) {
        const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }
</script>

</body>
</html>
