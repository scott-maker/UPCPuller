<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurement & Sourcing System</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for in-browser JSX transpiling -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Custom Hook for Local Storage ---
        function useLocalStorage(key, initialValue) {
            const [storedValue, setStoredValue] = useState(() => {
                try {
                    const item = window.localStorage.getItem(key);
                    return item ? JSON.parse(item) : initialValue;
                } catch (error) {
                    console.error(error);
                    return initialValue;
                }
            });

            const setValue = (value) => {
                try {
                    const valueToStore = value instanceof Function ? value(storedValue) : value;
                    setStoredValue(valueToStore);
                    window.localStorage.setItem(key, JSON.stringify(valueToStore));
                } catch (error) {
                    console.error(error);
                }
            };
            return [storedValue, setValue];
        }

        // --- Main Application Component ---
        function ProcurementApp() {
            const [activeTab, setActiveTab] = useState('dashboard');
            
            // Database State (Persisted in browser)
            const [items, setItems] = useLocalStorage('proc_items', [
                { id: 1, sku: 'SKU-1001', name: 'Industrial Sealant 10oz', category: 'Adhesives' }
            ]);
            const [vendors, setVendors] = useLocalStorage('proc_vendors', [
                { id: 1, name: 'Acme Supply Co.', terms: 'Net 30', score: 98.5 }
            ]);
            const [bids, setBids] = useLocalStorage('proc_bids', []);
            const [pos, setPos] = useLocalStorage('proc_pos', []);

            // --- Handlers ---
            const createPO = (bidId) => {
                const bid = bids.find(b => b.id === bidId);
                const newPO = {
                    id: Date.now(),
                    poNumber: `PO-${Math.floor(Math.random() * 10000)}`,
                    vendorId: bid.vendorId,
                    itemId: bid.itemId,
                    quantity: bid.quantity,
                    unitPrice: bid.unitPrice,
                    status: 'ISSUED',
                    date: new Date().toLocaleDateString()
                };
                setPos([...pos, newPO]);
                setBids(bids.map(b => b.id === bidId ? { ...b, awarded: true } : b));
                alert(`PO ${newPO.poNumber} Generated Successfully!`);
            };

            const receiveGoods = (poId) => {
                setPos(pos.map(p => p.id === poId ? { ...p, status: 'FULFILLED' } : p));
                alert('Goods Received and Logged!');
            };

            const submitBid = (e) => {
                e.preventDefault();
                const form = e.target;
                const newBid = {
                    id: Date.now(),
                    itemId: parseInt(form.item.value),
                    vendorId: parseInt(form.vendor.value),
                    quantity: parseInt(form.qty.value),
                    unitPrice: parseFloat(form.price.value),
                    awarded: false
                };
                setBids([...bids, newBid]);
                form.reset();
                alert('Bid logged for comparison!');
            };

            // --- View Components ---
            const renderDashboard = () => (
                <div class="grid grid-cols-3 gap-4">
                    <div class="bg-white p-6 rounded shadow border-t-4 border-blue-500">
                        <h3 class="text-gray-500 text-sm font-bold">Total Items</h3>
                        <p class="text-3xl font-black">{items.length}</p>
                    </div>
                    <div class="bg-white p-6 rounded shadow border-t-4 border-green-500">
                        <h3 class="text-gray-500 text-sm font-bold">Active Vendors</h3>
                        <p class="text-3xl font-black">{vendors.length}</p>
                    </div>
                    <div class="bg-white p-6 rounded shadow border-t-4 border-purple-500">
                        <h3 class="text-gray-500 text-sm font-bold">Open Purchase Orders</h3>
                        <p class="text-3xl font-black">{pos.filter(p => p.status === 'ISSUED').length}</p>
                    </div>
                </div>
            );

            const renderBidding = () => (
                <div class="bg-white p-6 rounded shadow">
                    <h2 class="text-xl font-bold mb-4 border-b pb-2">Log Vendor Bid / RFQ Response</h2>
                    <form onSubmit={submitBid} class="grid grid-cols-5 gap-4 mb-8">
                        <select name="item" required class="border p-2 rounded">
                            <option value="">Select Item...</option>
                            {items.map(i => <option key={i.id} value={i.id}>{i.sku} - {i.name}</option>)}
                        </select>
                        <select name="vendor" required class="border p-2 rounded">
                            <option value="">Select Vendor...</option>
                            {vendors.map(v => <option key={v.id} value={v.id}>{v.name} (Score: {v.score})</option>)}
                        </select>
                        <input type="number" name="qty" placeholder="Quantity" required class="border p-2 rounded" />
                        <input type="number" step="0.01" name="price" placeholder="Unit Price ($)" required class="border p-2 rounded" />
                        <button type="submit" class="bg-blue-600 text-white font-bold py-2 px-4 rounded hover:bg-blue-700">Add Bid</button>
                    </form>

                    <h2 class="text-xl font-bold mb-4 border-b pb-2">Bid Comparison Matrix</h2>
                    <table class="min-w-full bg-white border">
                        <thead>
                            <tr class="bg-gray-100 text-left">
                                <th class="p-3 border">Item</th>
                                <th class="p-3 border">Vendor</th>
                                <th class="p-3 border">Qty</th>
                                <th class="p-3 border">Unit Price</th>
                                <th class="p-3 border">Total Cost</th>
                                <th class="p-3 border">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {bids.filter(b => !b.awarded).map(bid => (
                                <tr key={bid.id} class="border-b">
                                    <td class="p-3">{items.find(i => i.id === bid.itemId)?.name}</td>
                                    <td class="p-3 font-bold text-blue-600">{vendors.find(v => v.id === bid.vendorId)?.name}</td>
                                    <td class="p-3">{bid.quantity}</td>
                                    <td class="p-3">${bid.unitPrice.toFixed(2)}</td>
                                    <td class="p-3">${(bid.quantity * bid.unitPrice).toFixed(2)}</td>
                                    <td class="p-3">
                                        <button onClick={() => createPO(bid.id)} class="bg-green-500 text-white px-3 py-1 rounded text-sm hover:bg-green-600">Award & Create PO</button>
                                    </td>
                                </tr>
                            ))}
                            {bids.filter(b => !b.awarded).length === 0 && (
                                <tr><td colSpan="6" class="p-4 text-center text-gray-500">No pending bids.</td></tr>
                            )}
                        </tbody>
                    </table>
                </div>
            );

            const renderPOs = () => (
                <div class="bg-white p-6 rounded shadow">
                    <h2 class="text-xl font-bold mb-4 border-b pb-2">Purchase Orders & Receiving</h2>
                    <table class="min-w-full bg-white border">
                        <thead>
                            <tr class="bg-gray-100 text-left">
                                <th class="p-3 border">PO Number</th>
                                <th class="p-3 border">Vendor</th>
                                <th class="p-3 border">Item</th>
                                <th class="p-3 border">Total ($)</th>
                                <th class="p-3 border">Status</th>
                                <th class="p-3 border">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {pos.map(po => (
                                <tr key={po.id} class="border-b">
                                    <td class="p-3 font-bold">{po.poNumber}</td>
                                    <td class="p-3">{vendors.find(v => v.id === po.vendorId)?.name}</td>
                                    <td class="p-3">{items.find(i => i.id === po.itemId)?.name} ({po.quantity})</td>
                                    <td class="p-3">${(po.quantity * po.unitPrice).toFixed(2)}</td>
                                    <td class="p-3">
                                        <span class={`px-2 py-1 rounded text-xs font-bold ${po.status === 'ISSUED' ? 'bg-yellow-200 text-yellow-800' : 'bg-green-200 text-green-800'}`}>
                                            {po.status}
                                        </span>
                                    </td>
                                    <td class="p-3">
                                        {po.status === 'ISSUED' && (
                                            <button onClick={() => receiveGoods(po.id)} class="bg-purple-500 text-white px-3 py-1 rounded text-sm hover:bg-purple-600">Receive Goods</button>
                                        )}
                                        {po.status === 'FULFILLED' && (
                                            <span class="text-gray-400 text-sm">Closed</span>
                                        )}
                                    </td>
                                </tr>
                            ))}
                            {pos.length === 0 && (
                                <tr><td colSpan="6" class="p-4 text-center text-gray-500">No Purchase Orders yet.</td></tr>
                            )}
                        </tbody>
                    </table>
                </div>
            );

            return (
                <div class="min-h-screen flex flex-col">
                    {/* Top Navigation */}
                    <header class="bg-gray-900 text-white p-4 shadow-md">
                        <div class="max-w-6xl mx-auto flex justify-between items-center">
                            <h1 class="text-2xl font-black tracking-tight">PROCURE<span class="text-blue-400">SYNC</span></h1>
                            <nav class="space-x-4">
                                {['dashboard', 'bidding', 'pos'].map(tab => (
                                    <button 
                                        key={tab}
                                        onClick={() => setActiveTab(tab)}
                                        class={`px-3 py-2 rounded font-semibold capitalize ${activeTab === tab ? 'bg-blue-600' : 'hover:bg-gray-700'}`}
                                    >
                                        {tab === 'pos' ? 'Purchase Orders' : tab}
                                    </button>
                                ))}
                            </nav>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main class="flex-grow max-w-6xl mx-auto w-full p-6">
                        {activeTab === 'dashboard' && renderDashboard()}
                        {activeTab === 'bidding' && renderBidding()}
                        {activeTab === 'pos' && renderPOs()}
                    </main>
                    
                    <footer class="text-center p-4 text-gray-400 text-sm">
                        Single-File React Procurement Prototype • Data saved to LocalStorage
                    </footer>
                </div>
            );
        }

        // Render the app to the DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ProcurementApp />);
    </script>
</body>
</html>
